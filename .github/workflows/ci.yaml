name: ci

# The checks of this repository, from the shared CI template of
# abap2UI5-addons (rap-ext, .github/ci/README.md):
#
#   abaplint      Standard ABAP (abaplint.jsonc) and ABAP Cloud
#                 (.github/abaplint/abap_cloud.jsonc)
#   npm-scripts   check:702 (a scratch copy of src/ downported and linted
#                 with abap_702.jsonc - the 7.02 gate of a pull request;
#                 ci-702 publishes the branch)
#   unit          the ABAP Unit tests on the transpiled runtime (npm run unit)
#   rename        the namespace rename check (npm run rename:
#                 .github/scripts/rename.mjs, abap2UI5's shared script)
#   abap2ui5lint  the app classes and their views (abap2ui5lint.jsonc)
#
# The sibling addons are resolved at the commit .github/deps.json pins, and
# the monthly bump-deps moves the pins. The weekly run is the canary: it
# resolves them at the tip of their main, so an upstream rename is
# noticed while no pull request is open.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # write only for publish-badges, which runs on main and never for a pull
    # request; every job that runs the code keeps a read-only token
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-check.yaml@d599eb227a476d120b473ae3b707fe983ab3e441 # ci-v1.1.0
    with:
      abaplint: '["./abaplint.jsonc", ".github/abaplint/abap_cloud.jsonc"]'
      npm-scripts: '["check:702"]'
      unit: true
      rename: true
      canary: ${{ github.event_name == 'schedule' }}
