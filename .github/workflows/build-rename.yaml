name: build-rename

# Renames every object to a chosen name and pushes the result to the branch
# rename_<name> - ready to pull with abapGit for a parallel installation in
# the same SAP system (shared CI template, addon-build-rename.yaml). The name
# is a customer name (ZMYUI5) or a registered namespace (/CA2UI5/), at most
# 10 characters; rename abap2UI5 and every addon of the installation with the
# same name.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "New name: ZMYUI5 (max. 10 characters) or a registered namespace /CA2UI5/ (max. 10 with both slashes) - the name the abap2UI5 installation was renamed to"
        required: true
        type: string
        default: znamespace

permissions:
  contents: read

concurrency:
  group: build-rename-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  build-rename:
    permissions:
      contents: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-build-rename.yaml@d599eb227a476d120b473ae3b707fe983ab3e441 # ci-v1.1.0
    with:
      namespace: ${{ inputs.namespace }}
