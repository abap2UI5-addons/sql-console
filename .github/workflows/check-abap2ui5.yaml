name: check-abap2ui5

# The abap2UI5-specific lint, as opposed to abap-standard/cloud/702, which lint
# ABAP itself. It reads a whole app class and the view it builds: the controls
# and members it writes, the structure of the document, the UI5 version floor,
# the data behind the bindings, and the abap2ui5 semantics no UI5 tooling sees.
# Settings live in abap2ui5lint.jsonc.
#
# @abap2ui5/linter-render is a devDependency because the render gate is the
# only reason for it: it carries the OpenUI5 packages and the browser the gate
# serves. The linter names it an OPTIONAL PEER, the one dependency kind npm
# does not install by itself - without it the views stop being rendered and the
# run still passes.

on:
  pull_request:
  push:
    branches: [main]
  # nothing else notices when an upstream rename breaks the views here
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-abap2ui5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abap2ui5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # the render gate drives a headless browser
    - run: npx playwright install chromium --with-deps
    - run: npx abap2ui5lint

    # the same run once more as markdown, into the run's own page - findings
    # and totals without expanding a log. --no-render because whether the views
    # load was already decided above; --no-badge so a pass that skipped a gate
    # cannot overwrite what the real run wrote.
    - name: Job summary
      if: always()
      run: npx abap2ui5lint --no-render --advisory --no-progress --no-badge --format markdown >> "$GITHUB_STEP_SUMMARY"

    # The gate above rewrote .github/badges/ (abap2ui5lint.jsonc "badge"), and
    # this step publishes those two files to the `badges` branch - an
    # orphan branch that holds nothing else and is what the README badges
    # read. Only on main: main is protected and github-actions[bot] cannot
    # bypass that, and the old way round - committing the badges onto the
    # pull request branch - started a second set of runs on that commit which
    # waited for a maintainer's approval and left the pull request blocked.
    # A pull request run publishes nothing; the run on main after the merge
    # does. Only after a green gate, as before. A failed push (a ruleset on
    # the branch) is a warning: the README then keeps showing the previous
    # state rather than a wrong one.
    - name: Publish the badges
      if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        ls .github/badges/*.json >/dev/null 2>&1 || { echo "::warning::The gate wrote no badge files - nothing to publish."; exit 0; }
        dir="$RUNNER_TEMP/badges"
        if git ls-remote --exit-code --heads origin badges >/dev/null; then
          git fetch -q --depth=1 origin badges
          git worktree add -q "$dir" FETCH_HEAD
          git -C "$dir" checkout -q -B badges
        else
          git worktree add -q --detach "$dir"
          git -C "$dir" switch -q --orphan badges
        fi
        cp .github/badges/*.json "$dir/"
        cd "$dir"
        git add -A
        if git diff --cached --quiet; then
          echo "The badges branch is up to date."
          exit 0
        fi
        git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
          commit -qm "Badges for ${GITHUB_SHA::7}"
        if git push -q origin badges; then
          echo "Badges published to the badges branch."
        else
          echo "::warning::The badges could not be pushed to the badges branch - the README keeps showing the previous state."
        fi
