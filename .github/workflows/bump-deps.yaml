name: bump-deps

# Every dependency update of this repository, once a month, in ONE pull
# request - on the last Sunday of the month (shared CI template,
# addon-bump-deps.yaml): npm, the pinned GitHub Actions and the pin of the CI
# template itself (both with the DEPS_TOKEN secret), and the
# sibling addons in .github/deps.json. Nothing else updates dependencies on a
# schedule; Dependabot's security updates are a repository setting and stay
# as they are.

on:
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC - the template picks the last one of the month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-deps
  cancel-in-progress: false

jobs:
  bump-deps:
    permissions:
      contents: write
      pull-requests: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-bump-deps.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
    with:
      repository: abap2UI5-addons/sql-console
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
