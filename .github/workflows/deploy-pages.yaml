name: deploy-pages

# The site of the repository on GitHub Pages
# (https://abap2ui5-addons.github.io/sql-console/), built with VitePress from site/
# (npm run site) - the same shape on every addon site. A pull request builds
# it, a push to main deploys it. The repository's Pages source must be
# "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the last-updated time of a page comes from the history
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: site/package-lock.json
    - run: npm ci --prefix site
    - run: npm run site
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
