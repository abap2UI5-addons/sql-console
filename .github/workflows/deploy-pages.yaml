name: deploy-pages

# The site of the repository on GitHub Pages
# (https://abap2ui5-addons.github.io/sql-console/), built with VitePress from site/
# (npm run site) by the shared CI template (addon-pages.yaml). A pull request
# builds it, a push to main deploys it. The repository's Pages source must be
# "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yaml'
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: abap2UI5-addons/rap-ext/.github/workflows/addon-pages.yaml@c81dfd461f69e42bb3678f51f80804066e2c9f96 # ci-v1.0.0
